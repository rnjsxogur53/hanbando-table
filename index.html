/* Layout: 앱 셸 — 위 스크롤 영역 + 아래 고정 탭바, 상세·시트는 위로 덮는 패널 */
:root{
  --bg:#FFFFFF; --surface:#F0F3F2; --line:#D8E0DE; --ink:#162123; --muted:#56635F; --faint:#88938F;
  --teal:#1F5662; --teal-soft:#E4EEF0; --north:#3E7A60; --north-soft:#E3F0E8;
  --yellow:#F6B93B; --yellow-soft:#FFF3D6; --yellow-ink:#7A5200; --south-map:#D3DAD8; --shadow:rgba(20,50,56,.10);
  color-scheme:light;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;letter-spacing:-0.2px;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
.view{flex:1;overflow-y:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 24px}
h1,h2,h3{margin:0;text-wrap:balance}
.hello{font-size:13px;color:var(--muted)}
.brand{font-size:24px;font-weight:800;color:var(--teal);letter-spacing:-0.6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top img{width:44px;height:44px;border-radius:13px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:48px;margin-bottom:20px}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);outline:none;min-width:0;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--faint)}
.sec{font-size:17px;font-weight:800;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-size:12px;font-weight:500;color:var(--muted)}
.today{display:block;width:100%;text-align:left;background:var(--teal);color:#fff;border-radius:22px;padding:18px;position:relative;overflow:hidden;margin-bottom:22px}
.today .tag{display:inline-block;background:var(--yellow);color:#3D2A00;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.today h2{font-size:24px;font-weight:800;margin:10px 0 4px;color:#fff}
.today p{margin:0;font-size:13.5px;line-height:1.5;opacity:.9;max-width:78%}
.today .reg{font-size:12.5px;opacity:.85;margin-top:12px}
.today svg{position:absolute;right:-14px;bottom:-18px;width:120px;height:120px;opacity:.16;color:#fff}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.cat{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;background:var(--teal-soft);border:1px solid #CFE0E3;color:var(--teal);font-size:14.5px;font-weight:700;transition:transform .12s}
.cat .ic{display:grid;place-items:center}
.cat.on{background:var(--teal);border-color:var(--teal);color:#fff}
.cat:active{transform:scale(.97)}
.list{display:flex;flex-direction:column;gap:10px}
.food{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 2px 6px var(--shadow)}
.food:active{background:var(--surface)}
.thumb{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;background:var(--north-soft);color:var(--north)}
.food .t{flex:1;min-width:0}
.food .n{font-weight:700;font-size:15.5px}
.food .m{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--faint)}
.empty{border:1px dashed var(--line);background:var(--surface);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}

/* tab bar */
.tabs{display:flex;border-top:1px solid var(--line);box-shadow:0 -2px 10px var(--shadow);position:relative;z-index:5;background:var(--bg);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--faint);font-weight:600;padding:4px 0}
.tab.on{color:var(--teal)}

/* fridge */
.addbar{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;height:50px;padding:0 14px;color:var(--faint);margin:14px 0 12px}
.addbar>span:first-child{flex:1;text-align:left}
.addbar .plus{width:28px;height:28px;border-radius:9px;background:var(--teal);color:#fff;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;font-weight:600}
.chip button{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;color:#fff}
.hint{font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:#E3E9E7;border-radius:4px;margin:7px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:4px}
.score{font-variant-numeric:tabular-nums;background:var(--yellow-soft);color:var(--yellow-ink)}
.have{color:var(--teal);font-weight:600}

/* map */
.view.mapv{display:flex;flex-direction:column;overflow:hidden}
.mapwrap{position:relative;flex:1;min-height:0;margin-top:8px}
.mapwrap svg{width:100%;height:100%;display:block}
.prov{stroke:var(--bg);stroke-width:2;stroke-linejoin:round;cursor:pointer;transition:filter .15s}
.prov:hover{filter:brightness(1.07)}
.south{fill:var(--south-map);stroke:var(--bg);stroke-width:1}
.mlabel{font-family:var(--font);font-size:15px;font-weight:800;fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:2px}
.mlabel.s{fill:var(--muted);stroke:none;font-weight:700}
.legend{position:absolute;left:0;bottom:4px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,20,22,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;z-index:21;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:78%;display:flex;flex-direction:column;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.sheet .scroll{overflow-y:auto;min-height:0}
.sinput{display:flex;align-items:center;gap:8px;border:1.5px solid var(--teal);border-radius:14px;height:50px;padding:0 14px;margin-bottom:10px}

const DATA = {"meta": {"app": "한반도 식탁", "version": "0.3", "note": "레시피의 재료·분량·조리 순서는 사실 정보만 참고했고, 모든 설명 문장은 새로 작성했다. 이야기 카드는 여러 자료를 종합해 새로 썼다.", "mainReference": {"title": "숨겨진 맛 북한전통음식 (한식재단)", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}}, "recipes": [{"id": "pyongyang-onban", "name": "평양온반", "region": "평양", "category": "밥", "servings": 4, "time": "약 1시간 30분", "keyIngredients": ["쌀", "닭고기", "녹두", "표고버섯", "느타리버섯", "달걀", "대파"], "ingredients": [{"group": "주재료", "items": ["멥쌀 3컵(600g)", "닭고기 250g", "표고버섯 5개", "느타리버섯 6개", "달걀 1개", "대파 1뿌리", "실고추 약간"]}, {"group": "닭고기 무침 양념", "items": ["간장 2큰술", "다진 파 1큰술", "다진 마늘 1/2큰술", "참기름 1큰술", "후춧가루 1/8작은술"]}, {"group": "닭 국물 간", "items": ["국간장 4작은술", "깨소금 1작은술", "후춧가루 1/8작은술", "소금 약간(닭 삶을 때)"]}, {"group": "버섯 볶음 양념", "items": ["간장 2큰술", "다진 파 2작은술", "다진 마늘 1작은술", "참기름 1작은술"]}, {"group": "녹두지짐 (1인분에 1장)", "items": ["녹두 1/2컵", "소금 1/8작은술", "식용유 2큰술"]}, {"group": "양념간장", "items": ["간장 4큰술", "다진 파 1큰술", "다진 마늘 1/2큰술", "고춧가루 1작은술", "깨소금 1작은술", "참기름 1큰술"]}], "steps": ["닭은 찬물에 넣고 삶기 시작해, 위로 떠오르는 거품을 계속 걷어 낸다. 30~40분 정도 끓여 속까지 익으면 소금을 조금 넣는다.", "익은 닭을 건져 살만 가늘게 찢고 '닭고기 무침 양념'으로 무친다. 뼈는 국물에 다시 넣어 진하게 우린 뒤 기름을 걷고, '닭 국물 간' 재료로 간한다.", "표고는 물에 불려 채 썰고, 느타리는 소금물에 살짝 데쳐 결대로 찢는다. 두 버섯을 '버섯 볶음 양념'에 함께 볶는다.", "'녹두지짐' 재료를 준비한다. 껍질 벗긴 녹두를 같은 양의 물과 함께 곱게 갈아, 식용유를 넉넉히 두른 팬에 손바닥보다 작게(지름 7cm 정도) 도톰하게 부친다. 소금은 부치기 직전에 넣어야 반죽이 묽어지지 않는다.", "달걀은 흰자와 노른자를 나눠 얇게 부친 뒤 가늘게 채 썰고, 대파도 가늘게 채 썬다. '양념간장' 재료를 모두 섞어 둔다.", "그릇에 따뜻한 밥을 담고 녹두지짐, 닭고기무침, 버섯볶음을 얹은 다음 뜨거운 닭 국물을 붓는다. 대파, 실고추, 지단을 올리고 양념간장을 곁들인다."], "story": "평양을 대표하는 네 가지 음식 중 하나로, 잔칫날과 명절에 손님상에 올리던 국밥이다. 북한 조리서에는 억울하게 옥에 갇힌 연인에게 명절 음식을 한 그릇에 모아 뜨거운 국물을 부어 가져다주고 '온반(더운밥)'이라 불렀다는 이야기가 전해진다. 따뜻한 밥 위에 녹두지짐을 얹는 것이 다른 국밥과 구별되는 점이다.", "southVersion": "남한의 닭곰탕·국밥과 닮았지만, 밥 위에 녹두지짐과 닭고기무침, 버섯볶음을 얹고 뜨거운 국물을 붓는다는 점이 다르다.", "substitutes": [{"from": "통녹두", "to": "시판 깐녹두", "tip": "껍질 벗기는 과정을 생략할 수 있다"}, {"from": "닭 한 마리", "to": "닭가슴살 + 시판 닭 육수", "tip": "시간을 크게 줄일 수 있다"}, {"from": "느타리버섯", "to": "새송이·팽이 등 집에 있는 버섯"}], "northTerms": [{"north": "닭알", "south": "달걀"}, {"north": "온반", "south": "더운밥(따뜻한 밥)"}], "sources": [{"title": "숨겨진 맛 북한전통음식 (한식재단) - 재료·조리 순서 참고", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}, {"title": "[출처 : 평양온반 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0079944"}, {"title": "서울신문 (2000) - 평양온반·평양냉면 소개", "url": "https://www.seoul.co.kr/news/2000/06/15/20000615007001"}], "amountsBasis": "『숨겨진 맛 북한전통음식』(한식재단) 4인분 분량 참고"}, {"id": "pyongyang-naengmyeon", "name": "평양냉면", "region": "평양", "category": "국수", "servings": 4, "time": "약 2시간", "keyIngredients": ["메밀가루", "전분", "소고기", "돼지고기", "닭고기", "동치미", "무", "오이", "배", "김치", "달걀"], "ingredients": [{"group": "면", "items": ["메밀가루 3컵", "고구마 전분 1컵", "식소다 1작은술", "뜨거운 물 약 1과 2/3컵"]}, {"group": "육수·고명", "items": ["소고기(양지) 150g", "돼지고기(목살) 100g", "닭 300g", "동치미무 1/2개", "동치미 국물 3컵", "오이 1개", "배 1/4개", "백김치 또는 배추김치 100g", "달걀 2개"]}, {"group": "간", "items": ["소금 1큰술", "간장 1작은술", "식초 1큰술", "겨자(기호)"]}], "steps": ["메밀가루와 고구마 전분을 섞고, 식소다를 푼 70℃ 정도의 뜨거운 물로 익반죽한다. 메밀만 쓰면 면이 쉽게 끊어지므로 전분을 섞는다.", "소고기와 돼지고기는 찬물에 담가 핏물을 뺀 뒤 각각 20분쯤 삶는다. 두 국물을 합쳐 닭과 큼직하게 썬 무를 넣고, 거품을 걷으며 40분 더 끓인다.", "고기를 건져 소·돼지고기는 결 반대 방향으로 얇게 저미고, 닭은 결대로 찢는다. 국물은 고운 체에 거른다. 썬 고기는 간한 국물에 살짝 잠기게 두면 마르지 않는다.", "남은 국물은 간장과 소금으로 간해 식힌 뒤, 고기 국물 7 : 동치미 국물 3 비율로 섞어 차게 보관한다.", "오이는 어슷하게, 배는 껍질과 씨를 빼고 얇게 썬다. 김치는 양념 없는 줄기 부분만 채 썬다. 달걀 하나는 삶아 반으로 가르고, 하나는 지단으로 부쳐 채 썬다.", "반죽을 국수틀로 뽑아 끓는 물에 삶고 찬물에 재빨리 헹궈 사리를 만든다. 그릇에 사리와 고명을 올리고 차가운 육수를 붓는다. 식초는 국물보다 면 위에 먼저 뿌려 섞으면 맛이 잘 산다."], "story": "지금은 여름 음식이지만 원래는 겨울 음식이었다. 『동국세시기』는 냉면을 겨울철 음식으로 꼽으며 서북 지방의 냉면을 으뜸으로 쳤다. 한겨울 땅에 묻은 독에서 얼음을 깨고 동치미를 떠 와, 뜨끈한 온돌방에서 국수를 말아 먹던 데서 시작됐다고 전해진다. 해방과 전쟁을 거치며 남쪽으로 내려온 평양 출신들이 서울과 연천 등에 냉면집을 열면서 남한 전역으로 퍼졌다.", "southVersion": "서울에서 가장 오래된 평양냉면집인 우래옥(1946)은 평양에서 식당을 하던 사람이 열었고, 을지면옥·필동면옥은 1·4 후퇴 때 내려온 평양 출신 할머니의 두 딸이 연 가게다. 남한의 평양냉면은 북에서 온 맛이 70년 넘게 이어진 결과다.", "substitutes": [{"from": "고구마 전분", "to": "감자 전분"}, {"from": "식소다(결탄산소다)", "to": "베이킹소다"}, {"from": "직접 담근 동치미", "to": "시판 동치미"}, {"from": "국수틀로 뽑은 면", "to": "시판 메밀냉면 사리", "tip": "집에서는 이 방법이 가장 현실적이다"}], "northTerms": [{"north": "랭면", "south": "냉면"}, {"north": "결탄산소다", "south": "식소다(베이킹소다)"}, {"north": "청무우", "south": "동치미무"}], "sources": [{"title": "숨겨진 맛 북한전통음식 (한식재단) - 재료·조리 순서 참고", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}, {"title": "[출처 : 평양냉면 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0059956"}, {"title": "주간경향 - 냉면, 한국 면음식의 대명사", "url": "https://weekly.khan.co.kr/article/18314"}, {"title": "서울신문 (2016) - 최고 70년 된 서울의 평양냉면 노포", "url": "https://m.seoul.co.kr/news/2016/06/17/20160617500237"}], "amountsBasis": "『숨겨진 맛 북한전통음식』 분량 참고"}, {"id": "nokdu-jijim", "name": "녹두지짐", "region": "평양", "category": "부침", "servings": 4, "time": "약 40분 (녹두 불리는 시간 별도)", "keyIngredients": ["녹두", "돼지고기", "김치", "숙주", "대파"], "ingredients": [{"group": "반죽", "items": ["깐녹두 2컵(약 320g)", "물 약 1컵", "소금 1/2작은술"]}, {"group": "속재료", "items": ["돼지고기(앞다리살) 100g", "배추김치 100g", "숙주 100g", "대파 1/2대"]}, {"group": "기름", "items": ["돼지기름 또는 식용유 넉넉히"]}, {"group": "찍어 먹는 장", "items": ["간장 2큰술", "식초 1큰술", "고춧가루 약간"]}], "steps": ["깐녹두를 5시간 이상(반나절 정도) 물에 담가 충분히 불린다. 껍질이 남아 있으면 물에서 비벼 떠오르는 껍질을 따라 버린다.", "불린 녹두에 물을 조금씩 넣으며 곱게 간다. 숟가락으로 떴을 때 천천히 흘러내릴 정도의 되직한 반죽이 좋다.", "돼지고기는 잘게 다지거나 얇게 썰고, 김치는 국물을 꼭 짜서 송송 썬다. 숙주는 데쳐 물기를 짠 뒤 짧게 자르고, 파는 어슷하게 썬다.", "녹두 반죽에 속재료를 모두 넣고 섞은 다음, 부치기 바로 전에 소금으로 간한다. 미리 간을 하면 반죽이 묽어진다.", "팬을 충분히 달군 뒤 기름을 넉넉히 붓고, 반죽을 크고 두툼하게 펼쳐 중불에서 지진다. 가장자리가 바삭하게 익으면 한 번만 뒤집는다.", "간장에 식초와 고춧가루를 섞은 장을 곁들여 뜨거울 때 먹는다."], "story": "녹두를 갈아 기름에 지지는 음식은 조선 시대 조리서에도 나올 만큼 오래되었고, 『규합총서』는 평양·평안도의 녹두지짐 맛이 유명하다고 적었다. 평안도 녹두지짐은 서울 빈대떡보다 크기가 세 배쯤 크고 두께도 두 배 가까이 두툼했다고 한다. 평양에서는 온반 위에 올려 먹는 짝꿍이기도 하다. 전쟁 이후 북한에서는 녹두가 귀한 작물이 되면서 집보다 음식점에서 사 먹는 별미가 되었다.", "southVersion": "남한에서는 '빈대떡' 또는 '녹두전'이라 부른다. 같은 음식이 남쪽에서는 시장 골목의 서민 음식으로, 북쪽에서는 귀한 별미로 자리 잡았다.", "substitutes": [{"from": "통녹두", "to": "깐녹두", "tip": "불리는 시간이 짧아지고 껍질 벗길 필요가 없다"}, {"from": "돼지기름", "to": "식용유"}], "northTerms": [{"north": "지짐", "south": "부침개·전"}], "sources": [{"title": "[출처 : 빈대떡 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0025277"}, {"title": "[출처 : 평양온반 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0079944"}, {"title": "미쉐린 가이드 - 서울에서 맛보는 이북 음식", "url": "https://guide.michelin.com/kr/ko/article/features/north_korean_food_in_seoul"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - 일부 사실 참고", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}], "amountsBasis": "여러 자료를 종합해 앱에서 정한 기준 분량"}, {"id": "kongkkaeguk-kalguksu", "name": "콩깨국칼국수", "region": "평안도", "category": "국수", "servings": 4, "time": "약 1시간 (콩 불리는 시간 별도)", "keyIngredients": ["콩", "들깨", "밀가루", "메밀가루", "소금"], "ingredients": [{"group": "콩깨국", "items": ["흰콩(대두) 1컵(약 160g)", "들깨 2큰술", "물 5컵", "소금 약간"]}, {"group": "면", "items": ["밀가루 2컵", "메밀가루 1/2컵", "물 약 3/4컵", "소금 한 꼬집"]}], "steps": ["콩은 씻어서 하룻밤(8시간 이상) 물에 불린다.", "불린 콩을 끓는 물에 넣고 5분쯤 데친 뒤 찬물에 헹구며 손으로 비벼 껍질을 벗긴다. 너무 오래 삶으면 메주 냄새가 난다.", "들깨는 물에 살짝 적셨다가 마른 팬에 볶는다. 이렇게 하면 알이 부풀어 더 고소해진다.", "데친 콩과 볶은 들깨를 물과 함께 곱게 갈아 체에 거른다. 소금으로 간한 뒤 냉장고에 넣어 차게 둔다.", "밀가루와 메밀가루에 소금을 섞어 반죽하고, 랩을 씌워 30분 휴지한다. 얇게 밀어 칼로 가늘게 썬다.", "면을 끓는 물에 삶아 찬물에 헹궈 그릇에 담고, 차가운 콩깨국을 넉넉히 붓는다. 간은 먹는 사람이 소금으로 맞춘다."], "story": "콩은 예로부터 서민의 귀한 단백질이었고, 콩을 갈아 국수를 말아 먹는 콩국수는 땀을 많이 흘리는 여름의 보양식이었다. 평안도에서 칼국수는 귀한 손님이 와야 해 먹는 별식이었고, 여기에 들깨를 함께 간 콩국을 부어 고소함을 더했다. 칼국수는 음력 6월에 유두면과 함께 많이 만들어 먹었는데, 유두날 밀가루 국수를 먹으면 여름 내내 더위를 먹지 않는다는 이야기가 전해진다.", "southVersion": "남한의 콩국수와 거의 같은 음식이다. 다만 들깨를 함께 갈아 더 고소하고 면에 메밀을 섞는다는 점이 다르다. 여름을 이기는 국수라는 생각은 남북이 똑같다.", "substitutes": [{"from": "콩 볶고 삶아 갈기", "to": "시판 콩물 + 들깻가루", "tip": "10분 만에 국물이 완성된다"}, {"from": "직접 민 칼국수면", "to": "시판 칼국수면 또는 메밀국수"}], "northTerms": [{"north": "콩깨국", "south": "콩국(콩물)"}], "sources": [{"title": "[출처 : 콩국수 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0058650"}, {"title": "[출처 : 유두면 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0041370"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - 일부 사실 참고", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}], "amountsBasis": "여러 자료를 종합해 앱에서 정한 기준 분량"}, {"id": "haeju-bibimbap", "name": "해주비빔밥", "region": "황해도", "category": "밥", "servings": 4, "time": "약 1시간 30분 (고사리 불리는 시간 별도)", "keyIngredients": ["쌀", "소고기", "돼지고기", "닭고기", "두부", "고사리", "도라지", "콩나물", "미나리", "표고버섯", "달걀", "김"], "ingredients": [{"group": "밥", "items": ["밥 4공기", "돼지비계 50g(또는 식용유 2큰술)", "소금·볶은 참깨 약간"]}, {"group": "고기", "items": ["소고기 100g", "돼지고기 100g", "닭고기 100g"]}, {"group": "나물·고명", "items": ["두부 1/2모", "콩나물 100g", "미나리 100g", "고사리 100g", "도라지 100g", "표고버섯 6개", "달걀 2개", "김 1장"]}, {"group": "소고기 양념", "items": ["간장 1작은술", "설탕 1작은술", "다진 파 1작은술", "다진 마늘 1/2작은술", "깨소금 1/2작은술", "참기름 1/2작은술", "후춧가루 1/8작은술"]}, {"group": "닭고기 양념", "items": ["소금 1/2작은술", "다진 파 1작은술", "다진 마늘 1/2작은술", "후춧가루 1/8작은술"]}, {"group": "돼지고기 양념", "items": ["간장 1작은술", "설탕 1작은술", "다진 파 1작은술", "다진 마늘 1/2작은술", "깨소금 1/2작은술", "참기름 1/2작은술", "후춧가루 1/8작은술", "생강즙 1작은술"]}, {"group": "콩나물 양념", "items": ["소금 1작은술", "다진 파 1작은술", "다진 마늘 1/2작은술", "참기름 1/2작은술"]}, {"group": "미나리 양념", "items": ["다진 파 1작은술", "다진 마늘 1/2작은술", "참기름 1/2작은술"]}, {"group": "도라지 양념", "items": ["소금 1작은술", "다진 파 1작은술", "다진 마늘 1/2작은술", "참기름 1/2작은술"]}, {"group": "표고버섯 양념", "items": ["간장 1작은술", "설탕 1/2작은술", "다진 파 1작은술", "다진 마늘 1/2작은술", "통깨 1/2작은술", "참기름 1/2작은술"]}, {"group": "고사리 양념", "items": ["국간장 1작은술", "다진 파 1작은술", "다진 마늘 1/2작은술"]}, {"group": "양념간장", "items": ["간장 1작은술", "설탕 1작은술", "다진 파 1작은술", "다진 마늘 1/2작은술", "깨소금 1/2작은술", "참기름 1/2작은술"]}], "steps": ["소고기와 닭고기는 각각 끓는 물에 20분쯤 삶아 가늘게 찢고, '소고기 양념'과 '닭고기 양념'으로 따로 무친다. 삶은 국물은 소금과 간장으로 간해 곁들임 국으로 쓴다.", "돼지고기는 '돼지고기 양념'에 무쳐 센 불에서 익힌 뒤 가늘게 채 썬다.", "두부는 도톰하게 썰어 기름에 노릇하게 튀기듯 지진 뒤 가늘게 채 썬다.", "콩나물은 소금물에 뚜껑을 열고 3~4분 삶아 '콩나물 양념'으로 무치고, 미나리는 줄기만 데쳐 '미나리 양념'으로 무친다.", "도라지는 가늘게 찢어 소금물에 담가 쓴맛을 뺀 뒤 '도라지 양념'으로 무친다. 표고는 채 썰어 '표고버섯 양념'에 볶는다. 마른 고사리는 6시간 이상 불린 뒤 20~30분 푹 삶아 '고사리 양념'에 볶는다.", "팬에 돼지비계를 올려 기름이 충분히 나오면 비계는 건져 내고, 밥을 넣어 소금과 참깨를 뿌리며 고슬하게 볶는다. 이 볶은 밥이 해주비빔밥의 핵심이다.", "볶은 밥을 그릇에 담고 고기, 두부, 나물을 색깔별로 둘러 올린 뒤 구운 김을 부숴 뿌린다. 달걀 지단을 채 썰어 올리고, 고추장 대신 '양념간장'에 비벼 고기 국물과 함께 먹는다."], "story": "'해주교반'이라고도 불린 황해도 해주의 명물이다. 옛 문헌 『해동죽지』는 밥을 기름에 볶는 것이 드물던 시절이라 해주비빔밥을 별난 음식으로 소개했다. 서해의 김과 해주 수양산의 고사리를 얹고, 소·돼지·닭 세 가지 고기를 모두 넣는 것이 특징이다. 동지나 섣달그믐에 한 해의 음식을 한 그릇에 모아 먹던 풍습에서 나왔다는 이야기도 있다.", "southVersion": "남한의 비빔밥은 대개 고추장으로 비비지만, 해주비빔밥은 간장으로 비빈다. 남한 편의점에서 해주비빔밥 도시락이 출시된 적도 있다.", "substitutes": [{"from": "세 가지 고기", "to": "집에 있는 고기 한 가지", "tip": "닭고기와 돼지고기만 올리는 방식도 있다"}, {"from": "기름에 튀긴 두부", "to": "시판 유부 또는 두부부침"}, {"from": "마른 고사리", "to": "시판 삶은 고사리"}], "northTerms": [{"north": "교반", "south": "비빔밥"}], "sources": [{"title": "[출처 : 해주비빔밥 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0079943"}, {"title": "데일리안 - 편의점 해주비빔밥 출시 기사", "url": "https://m.dailian.co.kr/news/view/886489"}, {"title": "위키트리 - 고사리 불리는 시간·삶는 시간", "url": "https://www.wikitree.co.kr/articles/1163850"}, {"title": "만개의레시피 - 콩나물 삶는 시간", "url": "https://www.10000recipe.com/recipe/7048646"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - 양념 분량 참고", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}], "amountsBasis": "재료 분량은 여러 자료를 종합해 앱에서 정한 기준 분량, 양념 분량은 『숨겨진 맛 북한전통음식』(한식재단) 4인분 참고"}, {"id": "hamhung-nongma-guksu", "name": "함흥농마국수", "region": "함경도", "category": "국수", "servings": 4, "time": "약 1시간 30분", "keyIngredients": ["감자전분", "소고기", "돼지고기", "닭고기", "무김치", "오이", "달걀", "고춧가루"], "ingredients": [{"group": "면", "items": ["감자 전분 400g", "끓는 물 약 1과 1/2컵(반죽 상태 보며 조절)", "백반 1/4작은술(선택)", "※ 직접 뽑기 어려우면 시판 함흥냉면 사리 4인분"]}, {"group": "꾸미·고명", "items": ["소고기(양지) 150g", "돼지고기(앞다리살) 100g", "닭고기 200g", "무김치 150g", "오이 1개", "달걀 2개", "실고추 약간"]}, {"group": "국물", "items": ["고기 삶은 국물 6컵", "간장 1큰술", "소금 약간"]}, {"group": "양념장", "items": ["고춧가루 4큰술", "간장 2큰술", "다진 파 2큰술", "다진 마늘 1큰술", "참기름 1큰술", "깨소금 1큰술", "고기 국물 4큰술"]}], "steps": ["소고기와 돼지고기는 20분쯤, 닭고기는 40분쯤 삶고 국물은 따로 둔다. 닭고기는 결대로 찢고 소·돼지고기는 버들잎처럼 얇게 썰어 국물에 담가 둔다.", "오이와 무김치는 고기와 비슷한 모양으로 얇게 썬다.", "다진 파·마늘, 고춧가루, 참기름, 깨소금, 간장을 고기 국물에 개어 걸쭉한 양념장을 만든다.", "감자 전분을 체에 쳐서 덩어리를 거른 뒤 끓는 물로 익반죽한다. 백반 푼 물을 조금씩 넣으면 면이 더 쫄깃해진다.", "반죽을 국수틀에 넣고 눌러 끓는 물에 삶는다. 전분 면은 메밀 면보다 빨리 익으니 40초 정도만 삶아 찬물에 바락바락 헹군다.", "사리 위에 고기·무김치·오이를 올리고 지단과 실고추로 고명을 얹는다. 국물을 부어 먹거나 양념장에 비벼 먹는다. 생선회를 올리면 회국수가 된다."], "story": "'농마'는 녹말을 뜻하는 북한 말이다. 개마고원 같은 고원이 많은 함경도는 감자가 잘 자라서, 감자 녹말로 뽑은 질긴 국수가 이 지역 대표 음식이 되었다. 잔치 때 꼭 내던 음식이라 결혼할 나이의 청년에게 '언제 국수 먹여 줄 거냐'고 묻는 인사가 있을 정도였다. 흥남에서 피난 온 실향민이 1953년 서울 오장동에 냉면집을 열었고, 남쪽에서 '함흥냉면'이라는 새 이름을 얻었다.", "southVersion": "남한의 '함흥냉면'이 바로 이 음식이다. 함경도 바닷가에서는 명태·가자미 같은 생선회를 올린 회국수도 먹었는데, 서울 오장동 냉면 골목의 회냉면도 삭힌 생선회무침을 올린다는 점에서 닮았다.", "substitutes": [{"from": "직접 뽑은 감자 전분 면", "to": "시판 함흥냉면 사리", "tip": "집에서 가장 쉬운 방법"}, {"from": "백반", "to": "생략 가능"}, {"from": "명태·가자미 회", "to": "시판 가오리(간자미) 회무침"}], "northTerms": [{"north": "농마", "south": "녹말(전분)"}, {"north": "농마국수", "south": "함흥냉면"}, {"north": "꾸미", "south": "고명(국수 위에 얹는 고기·채소)"}], "sources": [{"title": "[출처 : 함흥 농마국수 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0079947"}, {"title": "다음뉴스 (황교익) - 메밀국수와 그 사촌들의 계통도", "url": "https://v.daum.net/v/20240104070012754"}, {"title": "내 손안에 서울 - 오장동 흥남집, 비빔냉면은 함흥식", "url": "https://mediahub.seoul.go.kr/archives/1101695"}, {"title": "시선뉴스 - 북한음식 농마국수 만들기 [통일식당]", "url": "https://www.sisunnews.co.kr/news/articleView.html?idxno=150022"}, {"title": "만개의레시피 - 냉면 사리 삶는 시간", "url": "https://www.10000recipe.com/recipe/7031422"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - 평양냉면 고기 삶는 시간 참고", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}], "amountsBasis": "정확한 분량을 공개한 자료가 없어, 냉면류 4인분 비율을 참고해 앱에서 정한 기준 분량"}, {"id": "hamgyong-sundae", "name": "함경도순대 (아바이순대)", "region": "함경도", "category": "별미", "servings": 4, "time": "약 2시간", "keyIngredients": ["돼지 대창", "찹쌀", "선지", "배추", "숙주", "고사리", "대파", "마늘"], "ingredients": [{"group": "주재료", "items": ["돼지 대창 약 1m", "찹쌀 2컵(약 320g, 불리기 전)", "선지 150g", "배추 우거지 100g", "숙주 100g", "삶은 고사리 50g", "좁쌀 2큰술(선택)"]}, {"group": "양념", "items": ["다진 대파 2대 분량", "다진 마늘 2큰술", "생강즙 1작은술", "소금 1큰술", "후춧가루 1/2작은술", "참기름 1큰술"]}, {"group": "손질용", "items": ["밀가루·굵은소금 적당량", "식초 약간"]}], "steps": ["돼지 대창은 뒤집어 밀가루와 굵은소금으로 문질러 여러 번 헹구고, 식초 푼 물에 10분 담가 냄새를 뺀다.", "찹쌀은 1시간 이상 불려 물기를 빼고, 찜기에 쪄서 찰밥을 만든다.", "우거지, 숙주, 고사리는 데쳐서 물기를 꼭 짜고 잘게 다진다.", "찰밥, 다진 채소, 선지에 양념을 모두 넣고 고루 버무려 소를 만든다.", "대창 한쪽 끝을 실로 묶고 소를 70~80% 정도만 채운 뒤 반대쪽도 묶는다. 이쑤시개로 군데군데 구멍을 내 공기를 뺀다.", "김이 오른 찜기에 올려 중불에서 40분쯤 찐다. 중간에 한 번 뒤집어 주고, 다 익으면 한 김 식혀 도톰하게 썬다."], "story": "함경도식 순대는 찹쌀을 넣고 양념을 넉넉히 하는 것이 특징이고, 아바이순대는 여기에 굵은 돼지 대창을 쓴다. 1·4 후퇴 때 내려온 함경도 실향민들이 속초 청호동 모래톱에 판잣집을 짓고 모여 살았는데, 이 마을이 '아바이마을'이다. '아바이'는 아버지·어르신을 뜻하는 함경도 말이다. 고향 순대를 그리워하며 만들어 먹던 것이 오늘날 속초의 명물 아바이순대가 되었다.", "southVersion": "속초 아바이순대와 오징어순대가 모두 실향민이 고향 음식을 남쪽 재료로 바꿔 만든 음식이다. 분단이 만든 음식이면서 남북을 잇는 음식이기도 하다.", "substitutes": [{"from": "돼지 대창 손질", "to": "시판 아바이순대를 쪄서 데우기", "tip": "대창 손질은 집에서 어렵다"}, {"from": "대창에 채우기", "to": "소를 동그랗게 빚어 찌는 순대 완자", "tip": "앱 제안 간단 버전"}], "northTerms": [{"north": "아바이", "south": "아버지(어르신)"}], "sources": [{"title": "[출처 : 속초 아바이순대 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0079893"}, {"title": "위키백과 - 순대 (아바이순대 재료)", "url": "https://ko.wikipedia.org/wiki/%EC%88%9C%EB%8C%80"}, {"title": "요리픽 - 찰순대 레시피 (4인분 분량·찌는 시간 참고)", "url": "https://cookpick.kr/chalsundae-recipe/"}, {"title": "푸드투데이 - 속초 아바이마을·오징어순대", "url": "https://foodtoday.or.kr/news/article.html?no=203090"}, {"title": "미쉐린 가이드 - 서울에서 맛보는 이북 음식", "url": "https://guide.michelin.com/kr/ko/article/features/north_korean_food_in_seoul"}], "amountsBasis": "찰순대 4인분 레시피 비율을 바탕으로 아바이순대 재료 구성(백과사전 기준)에 맞게 조정한 기준 분량"}, {"id": "daedonggang-sungeoguk", "name": "대동강숭어국", "region": "평양", "category": "국", "servings": 4, "time": "약 50분", "amountsBasis": "『숨겨진 맛 북한전통음식』(한식재단) 4인분 분량 참고", "keyIngredients": ["숭어", "통후추", "홍고추", "풋고추", "소금", "생강", "마늘"], "ingredients": [{"group": "주재료", "items": ["숭어 1마리(약 1.5kg)", "물 7과 1/2컵", "홍고추 1개", "풋고추 1개"]}, {"group": "국물 간", "items": ["통후추 10알", "소금 4작은술"]}, {"group": "곁들이는 양념", "items": ["다진 생강 약간", "다진 마늘 약간"]}], "steps": ["숭어는 꼬리 쪽에서 머리 쪽으로 칼을 긁어 비늘을 벗기고, 배를 갈라 내장을 꺼낸다. 지느러미를 떼고 4~5cm 길이로 토막 낸다.", "통후추는 면보에 싸서 묶어 둔다. 이렇게 하면 나중에 건져 내기 쉽다.", "냄비에 찬물과 숭어 토막, 통후추 주머니를 넣고 끓기 시작하면 불을 줄여 살이 충분히 익을 때까지 끓인다.", "숭어가 익으면 통후추 주머니를 건져 내고, 홍고추와 풋고추를 어슷하게 썰어 넣는다.", "'국물 간'의 소금으로 간을 맞추고 그릇에 담는다. 다진 생강과 마늘을 곁들여 입맛대로 넣어 먹는다."], "story": "평양을 찾은 손님이 꼭 맛봐야 했던 국이다. 대동강 숭어국을 먹어 봐야 대접을 제대로 받았다고 여겼고, 평양에 다녀온 사람에게 그 맛이 어땠는지 묻는 것이 인사였을 정도다. 대동강은 바닷물과 민물이 만나는 곳이라 숭어가 많았고, 17세기 『도문대작』에도 평양의 언 숭어가 명물로 적혀 있다. 평양온반과 함께 '평양 4대 음식'의 하나로 꼽힌다.", "southVersion": "숭어는 대동강·청천강뿐 아니라 남쪽 영산강 하류에서도 많이 잡히는 물고기다. 같은 생선이 남북의 강에서 함께 잡히지만, 통후추만 넣고 맑게 끓이는 숭어국은 대동강 사람들의 방식이다.", "substitutes": [{"from": "통숭어 손질", "to": "마트에서 손질해 토막 낸 숭어", "tip": "비늘·내장 손질을 생략할 수 있다"}, {"from": "면보에 싼 통후추", "to": "다시백(국물용 티백)에 담은 통후추"}], "northTerms": [{"north": "숭엇국", "south": "숭어국"}], "sources": [{"title": "[출처 : 대동강숭엇국 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0079945"}, {"title": "[출처 : 평양온반 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0079944"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - 재료·분량 참고", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}]}, {"id": "myeongtae-maeuntang", "name": "명태매운탕", "region": "함경도", "category": "국", "servings": 4, "time": "약 50분", "amountsBasis": "만개의레시피 명태매운탕 4인분 분량 참고", "keyIngredients": ["명태", "무", "두부", "콩나물", "미나리", "양파", "대파", "고춧가루"], "ingredients": [{"group": "주재료", "items": ["명태(동태 또는 코다리) 2마리", "무 5cm 1토막", "두부 1/2모", "콩나물 1봉지", "미나리 1/2봉지", "양파 1/2개", "대파 1/2대", "육수(멸치·다시마) 1.5L"]}, {"group": "양념", "items": ["고춧가루 4큰술", "다진 마늘 2큰술", "멸치액젓 3큰술", "청주 2큰술", "후춧가루 1작은술", "소금 약간"]}], "steps": ["명태는 지느러미를 자르고 먹기 좋게 토막 낸다. 무는 납작하게, 두부와 양파는 큼직하게 썰고, 미나리는 5cm 길이로 자른다.", "육수에 무를 먼저 넣고 센 불에서 10분 정도 끓여 무 맛이 국물에 배게 한다.", "명태를 넣고 다시 끓으면 '양념'의 고춧가루, 다진 마늘, 청주, 양파를 넣는다. 멸치액젓으로 간한다.", "콩나물과 두부를 넣고 뚜껑을 덮어 5분쯤 더 끓인다. 콩나물 숨이 죽으면 대파를 넣는다.", "중불로 줄여 10분 정도 은근히 끓여 국물을 진하게 우린다.", "불을 끄기 직전에 미나리를 올리고 남은 열로 익힌다. 싱거우면 소금, 기호에 따라 후춧가루를 넣는다."], "story": "명태는 함경남도 앞바다에서 가장 많이 잡히던 생선이다. 함경도 명천에 사는 태씨 성의 어부가 처음 잡아 '명태'라는 이름이 붙었다는 이야기가 『임하필기』에 전한다. 알은 명란젓, 창자는 창난젓, 간은 기름으로 쓸 만큼 버릴 데가 없어서, 함경도 사람들의 겨울 밥상에는 명태 요리가 빠지지 않았다.", "southVersion": "남한의 동태찌개·생태탕과 같은 음식이다. 부르는 이름만 다를 뿐, 명태를 토막 내 무와 함께 얼큰하게 끓이는 방식은 남북이 똑같다.", "substitutes": [{"from": "생명태", "to": "냉동 동태 또는 반건조 코다리", "tip": "코다리는 살이 쫄깃하고 비린내가 덜하다"}, {"from": "멸치·다시마 육수", "to": "물 + 시판 멸치육수팩"}], "northTerms": [{"north": "명태탕", "south": "동태찌개"}], "sources": [{"title": "[출처 : 명태 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0018416"}, {"title": "만개의레시피 - 반건조 명태 매운탕 (4인분 분량·순서 참고)", "url": "https://www.10000recipe.com/recipe/6909675"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - '북한 지역별 전통음식 150가지' 목록", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}]}, {"id": "joraengi-tteokguk", "name": "조랭이떡국", "region": "개성", "category": "국", "servings": 4, "time": "약 1시간 30분", "amountsBasis": "만개의레시피 조랭이떡국 4인분 분량 참고", "keyIngredients": ["조랭이떡", "소고기", "대파", "마늘", "달걀"], "ingredients": [{"group": "주재료", "items": ["조랭이떡 500g", "소고기(양지머리) 300g", "대파 1뿌리", "마늘 4쪽", "달걀 1개", "물 약 10컵"]}, {"group": "고기 양념", "items": ["간장 1큰술", "다진 파 1작은술", "다진 마늘 1작은술", "깨소금 1작은술", "참기름 2작은술", "후춧가루 1/4작은술"]}, {"group": "국물 간", "items": ["국간장 약간", "소금 약간"]}], "steps": ["양지머리를 찬물에 담가 핏물을 뺀 뒤, 넉넉한 물에 대파 흰 부분과 마늘을 넣고 고기가 무를 때까지 1시간쯤 삶는다.", "고기는 건져 잘게 찢고 '고기 양념'으로 무친다. 국물은 식혀 위에 뜬 기름을 걷어 내고 약 8컵을 맞춘 뒤 '국물 간'으로 간한다.", "달걀은 노른자와 흰자를 나눠 얇게 부치고 마름모꼴로 썬다.", "조랭이떡은 찬물에 한 번 씻어 건진다.", "장국이 끓으면 떡을 넣고, 떡이 떠오르면 채 썬 대파 초록 부분을 넣어 한소끔 더 끓인다.", "그릇에 담고 양념한 고기와 달걀 지단을 올린다."], "story": "개성 지방의 떡국으로, 흰떡을 가늘게 밀어 대나무칼로 끊고 가운데를 잘록하게 비틀어 누에고치 모양으로 빚는다. 1940년에 나온 『조선요리학』에는 조선이 들어선 뒤 고려를 향한 마음을 간직한 개성 사람들이 '조선을 비틀어 버리고 싶다'는 뜻을 담아 떡을 비틀었다는 해석이 실려 있다.", "southVersion": "남한에서도 설날 떡국으로 즐겨 먹고, 조랭이떡은 마트에서 쉽게 살 수 있다. 개성은 지금 북한 땅이지만 이 떡국은 남쪽 설 밥상에 그대로 남아 있다.", "substitutes": [{"from": "양지머리 육수", "to": "시판 사골육수 + 소고기 다짐육", "tip": "고기 삶는 1시간을 줄일 수 있다"}, {"from": "조랭이떡", "to": "떡국떡", "tip": "모양만 다르고 맛은 같다"}], "northTerms": [], "sources": [{"title": "[출처 : 조랭이떡국 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0051699"}, {"title": "만개의레시피 - 조랭이떡국 (4인분 분량·순서 참고)", "url": "https://www.10000recipe.com/recipe/120939"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - '북한 지역별 전통음식 150가지' 목록", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}]}, {"id": "gaeseong-pyeonsu", "name": "개성편수", "region": "개성", "category": "별미", "servings": 4, "time": "약 1시간 30분", "amountsBasis": "여성경향 편수 레시피 분량과 백과·기사의 소 재료 비율(숙주·두부가 3분의 1을 넘지 않게)을 종합해 앱에서 정한 기준 분량", "keyIngredients": ["밀가루", "소고기", "돼지고기", "숙주", "두부", "김치", "잣"], "ingredients": [{"group": "만두피", "items": ["밀가루 1과 1/2컵", "찬물 약 4/5컵", "소금 한 꼬집"]}, {"group": "소", "items": ["소고기 100g", "돼지고기 100g", "숙주 80g", "두부 50g", "배추김치 50g", "잣 1큰술"]}, {"group": "소 양념", "items": ["간장 1큰술", "다진 파 1큰술", "다진 마늘 1작은술", "참기름 2작은술", "깨소금 1작은술", "후춧가루 약간"]}, {"group": "장국", "items": ["다시마 10×10cm 4장", "국물용 멸치 10마리", "물 8컵", "국간장 약간", "소금 약간"]}, {"group": "곁들이는 초장", "items": ["간장 2큰술", "식초 1큰술"]}], "steps": ["밀가루에 소금을 섞고 찬물을 조금씩 부어 날가루 없이 반죽한 뒤, 비닐에 싸서 냉장고에 30분 둔다.", "냄비에 물, 다시마, 마른 팬에 볶은 멸치를 넣고 10분 끓인 뒤 건더기를 건진다. '장국'의 국간장과 소금으로 간한다.", "소고기와 돼지고기는 곱게 다진다. 숙주는 데쳐서 다지고, 두부와 김치는 물기를 꼭 짜서 다진다.", "다진 재료를 모두 섞고 '소 양념'으로 간한다. 숙주와 두부가 많으면 맛이 싱거워지니 고기보다 적게 넣는다.", "반죽을 얇게 밀어 손바닥 반만 한 정사각형으로 자르고, 소와 잣 2~3알을 올린 뒤 네 귀를 모아 네모나게 붙인다.", "끓는 장국에 편수를 넣고 떠오르면 건져 장국과 함께 담는다. 여름에는 식혀서 차게 먹고, 초장을 곁들인다."], "story": "보통 만두가 반달 모양이라면 개성편수는 네모반듯하다. 조선 시대 개성 상인인 송상이 중국과 장사를 하며 만두 만드는 법을 들여왔고, 19세기 무렵 개성을 대표하는 음식이 되었다는 설명이 있다. 쇠고기·돼지고기·닭고기에 숙주와 두부를 섞되, 숙주와 두부가 전체의 3분의 1을 넘지 않아야 맛이 산다고 전해진다. 여름에는 차게 식혀 초장에 찍어 먹었다.", "southVersion": "남한의 만두는 반달이나 둥근 모양이 많지만, 편수는 네모나다. 편수는 널리 퍼지지는 못했지만, 개성 출신이 운영하는 식당에서 그 맛이 이어져 왔다. 남한의 여름 별미인 애호박 편수도 같은 이름을 쓴다.", "substitutes": [{"from": "직접 민 만두피", "to": "시판 만두피", "tip": "가장자리를 잘라 정사각형으로 만들면 된다"}, {"from": "다시마·멸치 장국", "to": "시판 사골육수"}], "northTerms": [{"north": "편수", "south": "네모 만두"}], "sources": [{"title": "경향신문 (2011) - 개성편수 이야기", "url": "https://www.khan.co.kr/article/201104122106465"}, {"title": "여성경향 - 편수 레시피 (만두피·소·장국 분량 참고)", "url": "https://lady.khan.co.kr/cooking/article/201001111452481"}, {"title": "위키트리 - 여름 별미 편수", "url": "https://www.wikitree.co.kr/articles/1050197"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - '북한 지역별 전통음식 150가지' 목록", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}]}, {"id": "gajami-sikhae", "name": "가재미식해", "region": "함경도", "category": "별미", "servings": 6, "time": "절이기 이틀 + 만들기 1시간 + 삭히기 1주일", "amountsBasis": "서울신문 가자미식해 조리법 분량 참고 (반찬으로 약 6인분), 절이는 방법은 한국민족문화대백과사전 참고", "keyIngredients": ["가자미", "조", "엿기름", "무", "고춧가루", "마늘", "생강", "대파"], "ingredients": [{"group": "주재료", "items": ["작은 가자미 1kg", "메조(좁쌀) 1컵", "무 400g", "굵은소금 약간"]}, {"group": "엿기름물", "items": ["엿기름가루 1컵", "물 3컵"]}, {"group": "양념", "items": ["고춧가루 1컵", "다진 파 4큰술", "다진 마늘 2큰술", "다진 생강 1큰술", "소금 1큰술"]}], "steps": ["가자미는 비늘과 내장, 머리를 떼고 소금을 살짝 뿌려 48시간 동안 얼간으로 절인다.", "절인 가자미를 보자기에 싸서 무거운 돌이나 그릇으로 눌러 물기를 뺀 뒤, 꼬리를 자르고 3cm 크기로 썬다.", "메조를 씻어 고슬고슬하게 밥을 짓고 넓게 펴서 식힌다.", "엿기름가루에 물을 부어 30분쯤 두었다가 윗물만 고운 체에 걸러 한 번 끓이고 식힌다. 엿기름이 조밥을 삭혀 단맛을 내는 것이 함경도식의 특징이다.", "무는 5cm 길이로 굵게 채 썰어 소금에 20분쯤 절인 뒤 물기를 짠다.", "조밥을 고춧가루로 먼저 버무리고, 가자미, 무, '양념', 엿기름물을 넣어 고루 섞는다. 항아리나 밀폐용기에 꼭꼭 눌러 담아 서늘한 실온에서 1주일쯤 삭힌다."], "story": "동해의 노랑가자미와 함경도에서 나는 좁쌀로 담그는 함경도의 저장 반찬이다. '식해'는 엿기름으로 만든 음료 '식혜'와 이름이 비슷하지만, 생선을 곡식과 함께 삭힌 젓갈에 가깝다. 전쟁 때 피란 온 함경도 사람들은 속초·강릉·삼척 같은 동해안에 자리를 잡았는데, 겨울마다 가자미식해를 담가야 해서 바다를 떠나지 못했다는 우스갯소리가 전해진다.", "southVersion": "지금 남한의 강원도 동해안, 특히 속초에서 가자미식해를 쉽게 만날 수 있는 이유가 바로 이 실향민들이다. 아바이순대와 함께 함경도의 맛이 남쪽 바닷가에 뿌리내린 대표적인 예다.", "substitutes": [{"from": "메조(좁쌀)", "to": "고슬하게 지은 흰밥", "tip": "단맛과 식감이 조금 달라진다"}, {"from": "이틀 절이기", "to": "소금에 3~4시간만 절인 뒤 키친타월로 물기 제거", "tip": "요즘 레시피에서 쓰는 빠른 방법. 살이 조금 더 무르다"}, {"from": "보자기에 싸서 누르기", "to": "볕에 3일쯤 꾸덕하게 말리기", "tip": "서울신문 조리법의 방식. 살이 더 쫄깃해진다"}], "northTerms": [{"north": "가재미", "south": "가자미"}], "sources": [{"title": "[출처 : 가자미식해 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0000318"}, {"title": "서울신문 (2007) - 가자미식해 (분량·실향민 이야기 참고)", "url": "https://www.seoul.co.kr/news/2007/01/18/20070118311005"}, {"title": "한국농어촌방송(K-한식비즈니스) - 가자미식해 (절이는 시간 참고)", "url": "https://www.kairnews.com/news/499046"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - '북한 지역별 전통음식 150가지' 목록", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}]}, {"id": "chongtteok", "name": "총떡", "region": "강원도", "category": "부침", "servings": 4, "time": "약 40분 (반죽 숙성 2시간 별도)", "amountsBasis": "만개의레시피 메밀총떡 2인분 분량을 4인분으로 늘리고, 위키백과의 강원도식 소 재료를 더한 기준 분량", "keyIngredients": ["메밀가루", "김치", "무", "돼지고기", "대파", "마늘", "들기름"], "ingredients": [{"group": "반죽", "items": ["메밀가루 2컵", "물 2컵", "소금 약간"]}, {"group": "소", "items": ["신김치 400g", "무 1/4개", "다진 돼지고기 100g(선택)", "대파 1/2대", "다진 마늘 1큰술"]}, {"group": "소 양념", "items": ["참기름 2큰술", "참깨 2큰술", "설탕 1큰술"]}, {"group": "기름", "items": ["들기름 또는 식용유 넉넉히"]}], "steps": ["메밀가루와 물을 1:1로 섞어 아주 묽은 반죽을 만들고, 냉장고에서 2시간 이상 숙성한다. 메밀은 찰기가 없어서 쉬어야 부칠 때 덜 찢어진다.", "신김치는 잘게 썰어 물기를 짜고, 무는 채 썰어 데친 뒤 물기를 짠다. 대파는 송송 썬다.", "돼지고기를 넣는다면 다진 마늘과 함께 먼저 볶는다. 김치, 무, 대파를 넣어 함께 볶고 '소 양념'으로 버무린다.", "약한 불에 팬을 달구고 기름을 얇게 두른 뒤, 반죽을 한 국자 떠서 얇고 넓게 편다.", "한 면이 익으면 뒤집고, 그 위에 소를 길게 올려 김밥처럼 돌돌 만다.", "같은 방법으로 반복해 부치고, 한 김 식으면 먹기 좋게 썬다."], "story": "메밀은 서늘한 산간에서 잘 자라는 곡식이라, 산이 많은 강원도에서는 메밀 음식이 일찍부터 발달했다. 얇게 부친 메밀전에 김치와 무로 만든 소를 넣고 길게 말아 낸 것이 총떡이다. 강원도는 휴전선을 사이에 두고 남과 북으로 나뉘어 있는데, 북쪽 강원도의 전통음식에도 총떡이 올라 있고, 남쪽에서도 '메밀총떡'이라는 이름을 함께 쓴다.", "southVersion": "남한 강원도의 '메밀전병'과 같은 음식이다. 영월·평창의 시장에는 메밀전과 메밀전병을 부치는 가게가 모여 있고, 평창에서는 메밀전을 '메밀부치기'라고 부른다. 한 도가 둘로 나뉘었어도 밥상은 그대로 이어져 있다는 걸 보여 주는 음식이다.", "substitutes": [{"from": "메밀가루만 쓰기", "to": "메밀부침가루", "tip": "밀가루가 섞여 있어 덜 찢어지고 숙성 없이 바로 부칠 수 있다"}, {"from": "데친 무", "to": "생략 가능", "tip": "김치만으로도 충분히 맛이 난다"}], "northTerms": [{"north": "총떡", "south": "메밀전병"}], "sources": [{"title": "위키백과(영문) - Memil-buchimgae (강원도식 소 재료·부치는 법)", "url": "https://en.wikipedia.org/wiki/Memil-buchimgae"}, {"title": "만개의레시피 - 메밀총떡 (분량·숙성 시간 참고)", "url": "https://www.10000recipe.com/recipe/6962577"}, {"title": "서울신문 (2017) - 메밀파스타와 메밀부치기 (영월·평창 메밀 음식)", "url": "https://m.seoul.co.kr/news/2017/12/21/20171221031007"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - '북한 지역별 전통음식 150가지' 목록", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}]}, {"id": "sunan-bulgogi", "name": "순안불고기", "region": "평안도", "category": "별미", "servings": 4, "time": "약 1시간", "amountsBasis": "『숨겨진 맛 북한전통음식』(한식재단) 4인분 분량 참고", "keyIngredients": ["소고기", "배", "간장", "설탕", "대파", "마늘", "참기름"], "ingredients": [{"group": "주재료", "items": ["소고기 등심 1kg"]}, {"group": "고기 양념장", "items": ["간장 8큰술", "설탕 3큰술", "다진 파 3큰술", "다진 마늘 1과 1/2큰술", "배즙 2큰술", "참기름 3큰술", "후춧가루 1/4작은술"]}, {"group": "찍어 먹는 초간장", "items": ["간장 2큰술", "식초 1큰술", "다진 파 2작은술", "다진 마늘 1작은술", "깨소금 1작은술"]}], "steps": ["'고기 양념장' 재료를 모두 섞어 둔다. 배즙은 강판에 배를 갈아 짜서 쓴다.", "등심은 8mm 두께로 넓게 저미고, 앞뒤로 칼끝으로 잘게 칼집을 낸다. 칼집을 내면 양념이 잘 배고 구울 때 덜 오그라든다.", "고기에 양념장을 넣고 주물러 30분 동안 재운다.", "숯불이나 달군 석쇠(집에서는 그릴팬)에 고기를 넓게 펴 올리고, 한쪽이 충분히 익으면 한 번만 뒤집어 굽는다.", "다 구운 고기는 먹기 좋게 잘라 담고, '찍어 먹는 초간장'을 곁들인다."], "story": "평양 북쪽의 순안은 북한의 국제공항이 있는 교통의 중심지이자, 사과가 유명할 만큼 농사가 잘되는 곳이다. 농사일을 돕는 소를 많이 기르던 지역이라 이곳의 불고기가 이름을 얻었다. 불고기는 고기를 꼬챙이에 꿰어 굽던 고구려의 '맥적'에서 시작해, 석쇠가 쓰이면서 지금처럼 넓게 펴서 굽는 모습이 되었다는 설이 있다.", "southVersion": "남한의 불고기와 뿌리가 같다. 남한에서는 국물이 자작한 불고기도 흔하지만, 순안불고기는 8mm로 두툼하게 저민 등심을 석쇠에 굽는 방식이라 남한의 석쇠 불고기에 더 가깝다.", "substitutes": [{"from": "배즙", "to": "시판 배 음료 또는 갈아 놓은 사과", "tip": "단맛과 고기를 부드럽게 하는 역할"}, {"from": "숯불 석쇠", "to": "그릴팬이나 프라이팬"}], "northTerms": [{"north": "불고기", "south": "불고기"}], "sources": [{"title": "[출처 : 불고기 - 한국민족문화대백과사전]", "url": "https://encykorea.aks.ac.kr/Article/E0024912"}, {"title": "숨겨진 맛 북한전통음식 (한식재단) - 재료·분량 참고", "url": "https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000003206312"}]}]};

const ALIAS = {'멥쌀':'쌀','계란':'달걀','닭알':'달걀','에그':'달걀','녹말':'전분','감자녹말':'감자전분','농마':'전분','대두':'콩','흰콩':'콩','메밀':'메밀가루',
  '파':'대파','쪽파':'대파','배추김치':'김치','백김치':'김치','삼겹살':'돼지고기','목살':'돼지고기','앞다리살':'돼지고기','양지':'소고기','쇠고기':'소고기',
  '닭':'닭고기','닭가슴살':'닭고기','밥':'쌀','찹쌀밥':'찹쌀','표고':'표고버섯','느타리':'느타리버섯','깨':'들깨','대창':'돼지 대창','곱창':'돼지 대창'};
const VOCAB = [...new Map([...R.flatMap(r=>r.keyIngredients), ...Object.keys(ALIAS)].map(v=>[v.replace(/\s+/g,''), v.replace(/\s+/g,'')])).values()].sort((a,b)=>a.localeCompare(b,'ko'));
const canon = w => ALIAS[w] || ALIAS[String(w).replace(/\s+/g,'')] || w;
function hits(recipe, have){
  const ks = recipe.keyIngredients;
  return ks.filter(k => have.some(h => { const c = canon(h); return k===c || k.includes(c) || c.includes(k); }));
}
// 초성 검색 (ㄷ → 달걀, 돼지고기 …)
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho = s => [...s].map(ch=>{const c=ch.charCodeAt(0)-0xAC00;return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch}).join('');
function suggest(q){
  q=q.replace(/\s+/g,''); if(!q) return VOCAB.filter(v=>!ALIAS[v]).slice(0,12);
  const isCho = /^[ㄱ-ㅎ]+$/.test(q);
  return VOCAB.filter(v => isCho ? cho(v).startsWith(q) : v.includes(q))
              .sort((a,b)=>(b.startsWith(q)-a.startsWith(q))||a.length-b.length).slice(0,12);
}

function todayPick(){ const d=new Date(); const n=d.getFullYear()*372+d.getMonth()*31+d.getDate(); return R[n % R.length]; }
function firstLine(t){ return t.split(/(?<=[.다요])\s/)[0]; }

function foodRow(r, extra=''){
  return `<button class="food" data-food="${r.id}">
    <span class="thumb">${ic(catIcon(r.category),26)}</span>
    <span class="t"><div class="n">${esc(r.name)}</div>${extra || `<div class="m">${esc(r.region)} · ${esc(r.category)} · ${esc(r.time)}</div>`}</span>
    <span class="chev">${ic('chev',18)}</span></button>`;
}

  const list = state.cat==='전체' ? R : R.filter(r=>r.category===state.cat);
  return `
    <button class="today" data-food="${t.id}">
      <span class="tag">오늘의 한 그릇</span>
      <h2>${esc(t.name)}</h2>
      <p>${esc(firstLine(t.story))}</p>

/* 장보기 목록: 냉장고에 없는 재료만 모은다 */
const NOT_SHOP = /^(물|찬물|뜨거운 물|끓는 물|고기 삶은 국물|고기 국물|육수.*|.*장국|소금 한 꼬집)$/;
function shoppingList(r){
  const f = ((state.serv && state.serv[r.id]) || r.servings) / r.servings;
  const map = new Map();
  r.ingredients.forEach(g=>g.items.forEach(it=>{
    if(it.startsWith('※')) return;
    const {name, amt} = splitItem(it);
    if(NOT_SHOP.test(name.replace(/\(.*?\)/g,'').trim()) || inFridge(name)) return;
    const key = fridgeName(name);
    // 양념처럼 조금씩 쓰는 재료는 '있는지'만 중요하니 분량을 빼고 이름만 적는다
    let a = amt && !FOLD_RE.test(g.group) && !TASTE_RE.test(amt) ? scaleText(amt, f, name) : '';
    if(TASTE_RE.test(a)) a = '';
    // 장 볼 때 쓰는 이름으로: '다진 마늘' → 마늘, '다진 파' → 대파
    let shopName = name.replace(/\(.*?\)/g,'').replace(/^(깐|다진|삶은|마른|불린|볶은)\s*/,'').trim();
    if(shopName.length===1) shopName = canon(shopName);
    if(map.has(key)){ const m = map.get(key); if(a && !m.amts.includes(a)) m.amts.push(a); }
    else map.set(key, {key, name: shopName, src: name, amts: a ? [a] : []});
  }));
  return [...map.values()];
}

/* ---------- 레시피: 인분 조절 · 재료 체크 · 요리 모드 ---------- */
const SERVINGS = [1,2,4,6];
const FRACS = [[0,''],[1/4,'1/4'],[1/3,'1/3'],[1/2,'1/2'],[2/3,'2/3'],[3/4,'3/4'],[1,'']];
const NUM_RE = /(\d+)\s*과\s*(\d+)\/(\d+)|(\d+)\/(\d+)|(\d+(?:\.\d+)?)/g;
const TASTE_RE = /약간|적당량|넉넉히|기호|조금|꼬집/;

// 분량 문자열의 숫자를 모두 같은 비율로 바꾼다
function fmtNum(v, unit, whole1){
  if(whole1 && /^개/.test(unit)) return String(Math.max(1, Math.ceil(v - 0.01)));   // 달걀처럼 쪼개기 어려운 건 올림
  if(/^(g|ml|kg)/.test(unit)){
    const step = v < 10 ? 1 : v < 100 ? 5 : 10;
    return String(Math.max(1, Math.round(v/step)*step));
  }
  let whole = Math.floor(v), frac = v - whole, best = FRACS[0];
  for(const f of FRACS) if(Math.abs(f[0]-frac) < Math.abs(best[0]-frac)) best = f;
  if(best[0]===1){ whole += 1; best = FRACS[0]; }
  if(whole===0 && !best[1]){
    if(/^작은술/.test(unit)) return '한 꼬집|';      // 너무 적으면 단위 대신 '한 꼬집'
    best = FRACS[1];
  }
  if(whole===0) return best[1];
  return best[1] ? `${whole}과 ${best[1]}` : String(whole);
}
function scaleText(text, f, name=''){
  const whole1 = /달걀|계란/.test(name);
  if(f===1) return text;
  return text.replace(NUM_RE, (m,a,b,c,d,e,g, off, str)=>{
    const v = a ? (+a + b/c) : d ? (d/e) : +g;
    const unit = str.slice(off + m.length).trimStart();
    if(/^큰술/.test(unit) && v*f < 1) return fmtNum(v*f*3, '작은술', whole1).replace(/\|$/,'') + '§';
    const out = fmtNum(v*f, unit, whole1);
    return out.endsWith('|') ? out.slice(0,-1) : out;
  }).replace(/§큰술/g,'작은술').replace(/한 꼬집작은술/g,'한 꼬집');
}
// "깐녹두 2컵(약 320g)" → 이름 "깐녹두", 분량 "2컵(약 320g)"
function splitItem(item){
  const m = item.match(/\s(약\s)?\d|\s(약간|적당량|넉넉히|한 꼬집)/);
  if(!m) return {name:item, amt:''};
  return {name:item.slice(0,m.index).trim(), amt:item.slice(m.index).trim()};
}
const MATCH_EXTRA = {'조':['메조','좁쌀'], '엿기름':['엿기름가루'], '배':['배즙'], '명태':['동태','코다리'], '소고기':['등심','양지머리'], '콩':['흰콩','대두'], '동치미':['동치미무','동치미 국물'], '무':['동치미무'], '배추':['배추 우거지','우거지'], '닭고기':['닭','닭가슴살'], '대파':['파'], '달걀':['계란','닭알'], '전분':['녹말','감자 전분','고구마 전분'], '쌀':['밥','멥쌀']};
function inFridge(name){ return state.have.some(h=>matchesHave(h, name)); }
const FOLD_RE = /양념|간$|장$|기름|손질|국물|소스/;
function isOpen(id, gi){ return !!(state.open && state.open[id] && state.open[id][gi]); }
function checksOf(id){ state.checks = state.checks || store.get('hb-checks', {}); return state.checks[id] || (state.checks[id] = {}); }
function saveChecks(){ store.set('hb-checks', state.checks); }

function recipeItems(r){
  const out = [];
  r.ingredients.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    if(it.startsWith('※')) return;
    const {name} = splitItem(it); out.push({key:`${gi}-${ii}`, name, fridge: inFridge(name)});
  }));
  return out;
}
function isChecked(id, item){ return inFridge(item.name); }
// 재료 이름 → 냉장고에 넣을 이름 ("돼지고기(앞다리살)" → 돼지고기, "깐녹두" → 녹두)
const nospace = x => String(x).replace(/\s+/g,'');
function fridgeName(name){
  const core = name.replace(/\(.*?\)/g,'').split(/·|\s또는\s|,/)[0].trim().replace(/^(깐|다진|삶은|마른|불린|볶은|뜨거운|끓는)\s*/,'').trim();
  return canon(nospace(core));
}
function matchesHave(h, name){
  const parts = name.replace(/\(.*?\)/g,'').split(/·|\s또는\s|,/).map(x=>x.trim()).filter(Boolean);
  const c = canon(h), keys = [h, c, ...(MATCH_EXTRA[c]||[])];
  // 한 글자 재료(물·파·배)는 '국물'·'양파'에 걸리지 않게 띄어쓰기 뒤에서만 인정
  // 띄어쓰기는 무시하고 비교한다 ("감자 전분" = "감자전분")
  return parts.some(p => { const pn = nospace(p);
    return keys.some(k => { const kn = nospace(k); return pn===kn || (kn.length>=2 && pn.endsWith(kn)) || p.endsWith(' '+k); }); });
}
function setHave(list){ state.have = list.filter((v,i,a)=>a.findIndex(x=>nospace(x)===nospace(v))===i); state.haveIsSample=false; store.set('hb-have', state.have); }

function recipePane(r){
  const base = r.servings, sv = (state.serv && state.serv[r.id]) || base, f = sv/base;
  const items = recipeItems(r), done = items.filter(it=>isChecked(r.id,it)).length;
  let html = `<div class="serv" role="radiogroup" aria-label="인분">${SERVINGS.map(n=>`<button role="radio" aria-checked="${n===sv}" data-serv="${n}" class="${n===sv?'on':''}">${n}인분</button>`).join('')}</div>
    <div class="servnote">${f===1?`${esc(r.time)}`:`${base}인분 기준으로 계산했어요 · 부침 기름과 조리 시간은 그대로예요`}</div>
    <div class="ihead"><h3>재료</h3><span><small>냉장고에 ${done}/${items.length}</small></span></div>
    ${(()=>{ const n = shoppingList(r).length; return n
      ? `<button class="shopbtn" data-shop="${r.id}">${ic('cart',20)}장보기 목록 만들기<span class="c">${n}개</span></button>`
      : `<button class="shopbtn done" disabled>${ic('check',20)}재료가 모두 냉장고에 있어요</button>`; })()}
    <div class="hint" style="margin:-2px 0 8px">체크하면 냉장고 탭에도 추가돼요</div>
    <div class="pbar"><i style="width:${items.length?Math.round(done/items.length*100):0}%"></i></div>`;
  const order = r.ingredients.map((g,gi)=>gi).sort((a,b)=>FOLD_RE.test(r.ingredients[a].group)-FOLD_RE.test(r.ingredients[b].group));
  order.forEach(gi=>{ const g = r.ingredients[gi];
    const foldable = FOLD_RE.test(g.group), open = !foldable || isOpen(r.id, gi);
    if(foldable){
      const its = g.items.filter(it=>!it.startsWith('※')).map((it,ii)=>({key:`${gi}-${g.items.indexOf(it)}`, name:splitItem(it).name}));
      const dn = its.filter(it=>isChecked(r.id,{...it, fridge:inFridge(it.name)})).length;
      html += `<div class="ing fold"><button class="gtog ${open?'open':''}" data-fold="${gi}" aria-expanded="${open}">
        <span class="gn">${esc(g.group)}</span><span class="gc">${its.length}가지</span>${dn?`<span class="gd">${dn}/${its.length}</span>`:'<span class="gd"></span>'}<span class="ch">${ic('chev',18)}</span></button>`;
      if(!open){ html += `</div>`; return; }
    } else html += `<div class="ing"><h5>${esc(g.group)}</h5>`;
    g.items.forEach((it,ii)=>{
      if(it.startsWith('※')){ html += `<div class="ihint">${esc(scaleText(it.replace(/^※\s*/,''), f))}</div>`; return; }
      const {name, amt} = splitItem(it), key=`${gi}-${ii}`;
      const item = {key, name, fridge: inFridge(name)}, on = isChecked(r.id, item);
      const taste = !amt || TASTE_RE.test(amt);
      const badge = (!on && taste && f!==1 ? `<span class="bdg ta">${/넉넉히/.test(amt)?'팬 크기에 맞게':'입맛대로'}</span>` : '');
      html += `<button class="ck ${on?'on':''}" data-ck="${key}" aria-pressed="${on}">
        <span class="bx">${on?ic('check',15):''}</span><span class="nm">${esc(name)}</span>${badge}<span class="amt">${esc(scaleText(amt, f, name))}</span></button>`;
    });
    html += `</div>`;
  });
  html += `<div class="shead" id="secSteps"><h3>만드는 순서</h3><button class="cookbtn" data-cook="${r.id}">${ic('play',16)}요리 시작</button></div>
    <ol class="steps">${r.steps.map(st=>`<li><span>${esc(st)}</span></li>`).join('')}</ol>
    ${r.amountsBasis?`<div class="note" style="margin:24px 0 0">분량 기준: ${esc(r.amountsBasis)}</div>`:''}`;
  return html;
}

// 요리 모드: 한 단계씩 크게 보여 준다
let cook = null, wake = null;
function stepIngredients(r, text, f){
  const used = [];
  r.ingredients.forEach(g=>{
    const gname = g.group.replace(/\s*\(.*\)/,'').trim();
    if(!text.includes(`'${gname}'`)) return;
    g.items.forEach(it=>{ if(it.startsWith('※')) return; const {name, amt} = splitItem(it);
      used.push({group:gname, name, amt: amt && !TASTE_RE.test(amt) ? scaleText(amt,f,name) : (amt||'')}); });
  });
  if(used.length) return used;
  r.ingredients.forEach(g=>g.items.forEach(it=>{
    if(it.startsWith('※')) return;
    const {name, amt} = splitItem(it);
    const core = name.replace(/\(.*?\)/g,'').split(/·|\s또는\s/)[0].replace(/^(깐|다진|삶은|마른|불린)\s*/,'').trim();
    // '물'이 '물기'에 걸리지 않도록 단어 뒤에 조사·공백이 올 때만 인정한다
    const full = name.replace(/\(.*?\)/g,'').split(/·|\s또는\s/)[0].trim();
    const cands = [full, core, ...(/.+김치$/.test(core) ? ['김치'] : [])];
    const hit = cands.find(c => new RegExp('(?<=^|[\\s,(·])' + c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(을|를|이|가|은|는|에|과|와|로|으로|도|만|,|\\.|\\s|$)').test(text));
    if(hit && !used.some(u=>u.name===core)) used.push({name:core, amt: amt && !TASTE_RE.test(amt) ? scaleText(amt,f,name) : ''});
  }));
  return used.slice(0,6);
}
/* 타이머: 단계 문장에서 '20분', '30~40분', '1시간', '8시간' 같은 시간을 찾아 버튼으로 만든다 */
const TIME_RE = /(\d+)\s*(?:~\s*(\d+))?\s*(시간|분|초)/g;
function stepTimes(text){
  const out = []; let m; TIME_RE.lastIndex = 0;
  while((m = TIME_RE.exec(text))){
    const a = +m[1], unit = m[3], ms = a * (unit==='시간' ? 3600000 : unit==='분' ? 60000 : 1000);
    const label = m[2] ? `${a}~${m[2]}${unit}` : `${a}${unit}`;
    if(!out.some(o=>o.label===label)) out.push({label, ms, short: `${a}${unit}`});
  }
  return out;
}
let timers = [], tick = null, actx = null;
const tKey = (id, step, label) => `${id}|${step}|${label}`;
function remain(t){ return t.paused!=null ? t.paused : Math.max(0, t.end - Date.now()); }
function fmtT(ms){ const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; }
function beep(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(d=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, actx.currentTime+d); g.gain.exponentialRampToValueAtTime(0.3, actx.currentTime+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d+0.28); o.start(actx.currentTime+d); o.stop(actx.currentTime+d+0.3); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([300,150,300,150,300]); }catch(e){}
}
function toast(msg, btn){
  const el=$('#toast'); el.innerHTML = `<span>${esc(msg)}</span>${btn?`<button data-toastgo="1">${esc(btn)}</button>`:''}`;
  el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(()=>el.classList.remove('on'), 8000);
}
function startTimer(id, step, label, ms){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); }catch(e){}
  const k = tKey(id, step, label);
  timers = timers.filter(t=>t.key!==k);
  timers.push({key:k, id, step, label, total:ms, end:Date.now()+ms, paused:null, done:false});
  runTick(); drawCook();
}
function runTick(){
  if(tick) return;
  tick = setInterval(()=>{
    let changed = false;
    timers.forEach(t=>{ if(!t.done && t.paused==null && remain(t)<=0){ t.done=true; changed=true; beep();
      const r=R.find(x=>x.id===t.id); toast(`${r.name} ${t.step+1}단계 · ${t.label} 타이머가 끝났어요`, cook?null:'보기'); } });
    document.querySelectorAll('[data-tleft]').forEach(el=>{ const t=timers.find(x=>x.key===el.dataset.tleft); if(t) el.textContent = t.done ? '끝!' : fmtT(remain(t)); });
    if(changed && cook) drawCook();
    if(!timers.some(t=>!t.done && t.paused==null)){ clearInterval(tick); tick=null; }
  }, 500);
}
function timerBtn(r, i, tm){
  const t = timers.find(x=>x.key===tKey(r.id,i,tm.label));
  if(!t) return `<button class="tbtn" data-tstart="${i}|${tm.label}|${tm.ms}">${ic('clock',18)}${esc(tm.label)} 타이머</button>`;
  if(t.done) return `<button class="tbtn done" data-tstop="${t.key}">${ic('clock',18)}끝! 눌러서 끄기</button>`;
  const run = t.paused==null;
  return `<button class="tbtn ${run?'run':'paused'}" data-ttoggle="${t.key}">${ic(run?'pause':'play',18)}<span data-tleft="${t.key}">${fmtT(remain(t))}</span><small>${run?'남음':'멈춤'}</small></button>
    <button class="tx" data-tstop="${t.key}" aria-label="타이머 끄기">${ic('x',16)}</button>`;
}
function drawCook(){
  const r = R.find(x=>x.id===cook.id), n = r.steps.length, i = cook.i;
  const f = ((state.serv && state.serv[r.id]) || r.servings) / r.servings;
  const el = $('#cook');
  let body;
  if(i >= n){
    body = `<div class="card"><div class="fin"><div class="big">🍲</div><h2>${esc(r.name)} 완성!</h2><p>맛있게 드세요.<br>이야기 탭에서 이 음식에 담긴 사연도 읽어 보세요.</p></div></div>
      <div class="nav"><button class="pv" data-cstep="-1">이전</button><button class="nx" data-cclose="1">닫기</button></div>`;
  } else {
    const used = stepIngredients(r, r.steps[i], f);
    const tms = stepTimes(r.steps[i]);
    body = `<div class="card"><div class="n">${i+1}</div><p>${esc(r.steps[i])}</p>
      ${tms.length?`<div class="tmr">${tms.map(tm=>timerBtn(r,i,tm)).join('')}</div>`:''}
      ${[...new Set(used.map(u=>u.group||''))].map(gr=>`${gr?`<div class="ugrp">${esc(gr)}</div>`:''}<div class="used">${used.filter(u=>(u.group||'')===gr).map(u=>`<span>${esc(u.name)}${u.amt?` <b>${esc(u.amt)}</b>`:''}</span>`).join('')}</div>`).join('')}</div>
      <div class="nav"><button class="pv" data-cstep="-1" ${i===0?'disabled':''}>이전</button><button class="nx" data-cstep="1">${i===n-1?'완성':'다음 단계'}</button></div>`;
  }
  el.innerHTML = `<div class="ctop"><b>${esc(r.name)}</b><button class="x" data-cclose="1" aria-label="요리 모드 닫기">${ic('x',20)}</button></div>
    <div class="cnt">${i>=n?'완성':`${i+1} / ${n} 단계`}</div>
    <div class="dots">${r.steps.map((_,k)=>`<i class="${k<=i?'done':''}"></i>`).join('')}</div>
    ${(()=>{ const other = timers.filter(t=>t.id===r.id && t.step!==i); return other.length?`<div class="trun" style="margin:-6px 0 12px">${other.map(t=>`<button class="${t.done?'done':''}" data-tgo="${t.step}">${t.step+1}단계 ${esc(t.label)} · <span data-tleft="${t.key}">${t.done?'끝!':fmtT(remain(t))}</span></button>`).join('')}</div>`:''; })()}${body}`;
}
async function openCook(id){
  cook = {id, i:0}; const live = timers.filter(t=>t.id===id && !t.done); if(live.length) cook.i = live[live.length-1].step; drawCook(); $('#cook').classList.add('on');
  try{ if(navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); }catch(e){ wake = null; }
}
function closeCook(){
  if(timers.some(t=>!t.done)) toast('타이머는 계속 돌아가요. 끝나면 알려 드릴게요.'); $('#cook').classList.remove('on'); cook=null; try{ wake && wake.release(); }catch(e){} wake=null; }
(function swipe(){
  let x0=null;
  document.addEventListener('touchstart', e=>{ if(cook && e.target instanceof Element && e.target.closest('#cook')) x0=e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!cook || x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
    const n=R.find(x=>x.id===cook.id).steps.length;
    if(dx<-60 && cook.i<n){ cook.i++; drawCook(); } else if(dx>60 && cook.i>0){ cook.i--; drawCook(); }
  }, {passive:true});
})();

/* ---------- 화면 전환 ---------- */
// 카테고리를 고르지 않은 첫 화면은 화면 높이에 맞춰 칸을 고르게 벌린다
function updateHome(){ const b=$('#homeBody'); if(!b) return; b.innerHTML = homeBody(); $('#view').classList.toggle('homev', !state.cat && !state.q.trim()); }
const TABS = ['home','fridge','map','food'];
function render(keepScroll){
  const v = $('#view'), st = v.scrollTop;
  v.classList.toggle('flush', state.tab==='food');
  v.classList.toggle('mapv', state.tab==='map');
  v.classList.toggle('homev', state.tab==='home' && !state.cat && !state.q.trim());
  v.innerHTML = state.tab==='home' ? renderHome() : state.tab==='fridge' ? renderFridge() : state.tab==='map' ? renderMap() : renderFood();
  v.scrollTop = keepScroll ? st : 0;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===state.tab));
  if(state.tab==='home'){
    // 한글 조합이 끊기지 않도록 입력창은 그대로 두고 결과 부분만 바꾼다
    $('#q').addEventListener('input', e=>{ state.q=e.target.value; updateHome(); });
  }
}
function hashOf(){ return state.tab==='food' && state.food ? 'food-'+state.food : state.tab; }
function snapshot(){ return {tab:state.tab, food:state.food, seg:state.seg}; }
function apply(st){ closeSheet(); if(cook) closeCook(); Object.assign(state, st); render(); }
// 화면을 옮길 때마다 기록을 쌓고, 뒤로 가기는 그 기록을 하나씩 되돌린다 (폰의 뒤로 버튼과 같은 동작)
function nav(change){
  Object.assign(state, change); render();
  const i = ((history.state && history.state.i) || 0) + 1;
  try{ history.pushState({i, st:snapshot()}, '', '#'+hashOf()); }catch(e){}
}
function back(){
  if(cook){ closeCook(); return; }
  if(history.state && history.state.i > 0) history.back();
  else nav({tab:'home', food:null});
}
window.addEventListener('popstate', e=>{
  if(e.state && e.state.st) apply(e.state.st);
  else apply(fromHash());
});
function fromHash(){
  const h = location.hash.slice(1) || 'home';
  if(h.startsWith('food-') && R.some(r=>r.id===h.slice(5))) return {tab:'food', food:h.slice(5), seg:'recipe'};
  return {tab: TABS.includes(h) ? h : 'home', food:null, seg:'recipe'};
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button,path.prov,#scrim'); if(!t) return;
  if(t.id==='scrim'){ closeSheet(); return; }
  if(t.id==='backBtn'){ back(); return; }
  if(t.dataset.tab){ if(t.dataset.tab!==state.tab) nav({tab:t.dataset.tab}); else if(t.dataset.tab==='food' && state.food) nav({food:null}); else render(); return; }
  if(t.dataset.food){ closeSheet(); if(t.dataset.food!==state.food || state.tab!=='food') nav({tab:'food', food:t.dataset.food, seg:'recipe'}); return; }
  if(t.dataset.cat){ state.cat = state.cat===t.dataset.cat ? null : t.dataset.cat; updateHome(); return; }
  if(t.dataset.seg){ state.seg=t.dataset.seg; render(true); try{ history.replaceState({...history.state, st:snapshot()}, '', location.hash); }catch(e){} return; }
  if(t.dataset.fold!==undefined){ state.open = state.open||{}; const o = state.open[state.food] = state.open[state.food]||{}; o[t.dataset.fold] = !o[t.dataset.fold]; render(true); return; }
  if(t.dataset.serv){ state.serv = state.serv || {}; state.serv[state.food] = +t.dataset.serv; render(true); return; }
  if(t.dataset.ck){ const r=R.find(x=>x.id===state.food), it=recipeItems(r).find(x=>x.key===t.dataset.ck);
    if(inFridge(it.name)) setHave(state.have.filter(h=>!matchesHave(h, it.name)));
    else setHave([...state.have, fridgeName(it.name)]);
    render(true); return; }
  if(t.dataset.cook){ openCook(t.dataset.cook); return; }
  if(t.dataset.shop){ openShop(t.dataset.shop); return; }
  if(t.dataset.shopcopy){ copyShop(t.dataset.shopcopy); return; }
  if(t.dataset.shopshare){ shareShop(t.dataset.shopshare); return; }
  if(t.dataset.got){ setHave([...state.have, fridgeName(t.dataset.got)]); render(true); openShop(state.food); return; }
  if(t.dataset.cstep){ const n=R.find(x=>x.id===cook.id).steps.length; cook.i=Math.max(0,Math.min(n,cook.i+ +t.dataset.cstep)); drawCook(); return; }
  if(t.dataset.cclose){ closeCook(); return; }
  if(t.dataset.tstart){ const [st,label,ms]=t.dataset.tstart.split('|'); startTimer(cook.id, +st, label, +ms); return; }
  if(t.dataset.ttoggle){ const tm=timers.find(x=>x.key===t.dataset.ttoggle);
    if(tm.paused==null){ tm.paused=remain(tm); } else { tm.end=Date.now()+tm.paused; tm.paused=null; runTick(); } drawCook(); return; }
  if(t.dataset.tstop){ timers=timers.filter(x=>x.key!==t.dataset.tstop); drawCook(); return; }
  if(t.dataset.tgo){ cook.i=+t.dataset.tgo; drawCook(); return; }
  if(t.dataset.toastgo){ $('#toast').classList.remove('on'); const d=timers.find(x=>x.done); if(d){ openCook(d.id); cook.i=d.step; drawCook(); } return; }
  if(t.id==='addBtn'){ openAdd(); return; }
  if(t.id==='infoBtn'){ openInfo(); return; }
  if(t.dataset.add){ setHave([...(state.haveIsSample?[]:state.have), t.dataset.add]); render(true); drawSugg($('#ingQ').value); return; }
  if(t.dataset.del){ state.have=state.have.filter(h=>h!==t.dataset.del); state.haveIsSample=false; store.set('hb-have',state.have); render(true); return; }
  if(t.dataset.group){ openRegion(t.dataset.group); return; }
});

Object.assign(state, fromHash()); render();
try{ history.replaceState({i:0, st:snapshot()}, '', '#'+hashOf()); }catch(e){}
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
